<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kim Live - OpenAI API Key</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6f7f9;
      color: #171717;
    }
    main {
      width: min(620px, calc(100vw - 32px));
      background: #fff;
      border: 1px solid #dadde3;
      border-radius: 8px;
      padding: 24px;
      box-sizing: border-box;
    }
    h1 { margin: 0 0 12px; font-size: 24px; letter-spacing: 0; }
    p { line-height: 1.45; color: #4b5563; }
    label { display: block; margin: 18px 0 8px; font-weight: 600; }
    input {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #c9ced8;
      border-radius: 8px;
      padding: 12px;
      font: 15px ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    button {
      margin-top: 14px;
      width: 100%;
      border: 0;
      border-radius: 8px;
      padding: 12px;
      background: #111827;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
    }
    .status { margin-top: 14px; min-height: 24px; }
    a { color: #111827; }
  </style>
</head>
<body>
  <main>
    <h1>OpenAI API Key para Kim Live</h1>
    <p>
      Crea una key en OpenAI, pegala aqui y la Mac la guardara en Keychain.
      No se guarda en archivos de BIFROST ni se manda por Telegram.
    </p>
    <p>
      Crear key:
      <a href="https://platform.openai.com/api-keys" target="_blank" rel="noreferrer">
        https://platform.openai.com/api-keys
      </a>
    </p>
    <label for="key">API key</label>
    <input id="key" type="password" autocomplete="off" placeholder="sk-... o sk-proj-...">
    <button id="save">Guardar en Keychain</button>
    <div class="status" id="status"></div>
  </main>
  <script>
    const key = document.getElementById("key");
    const status = document.getElementById("status");
    document.getElementById("save").onclick = async () => {
      status.textContent = "Guardando...";
      try {
        const response = await fetch("/api/store-openai-key", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({api_key: key.value})
        });
        const data = await response.json();
        if (!data.ok) throw new Error(data.error || "No se pudo guardar");
        key.value = "";
        status.textContent = "Listo. API key guardada en macOS Keychain.";
      } catch (err) {
        status.textContent = "Error: " + err.message;
      }
    };
  </script>
</body>
</html>
